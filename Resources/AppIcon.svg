  <circle cx="640" cy="608" r="132" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFC93C" stroke-width="48"/>
  <path d="M588 572 a70 70 0 0 1 56 -36" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9"/>
